            - generic [ref=f9e108]:
              - text: 01 ·
              - generic [ref=f9e109]: Produção
            - generic [ref=f9e111]:
              - heading "Trocar a fundação de um sistema em uso diário" [level=3] [ref=f9e112]
              - paragraph [ref=f9e113]: Plataforma interna de uma consultoria de tecnologia, em uso diário por toda a empresa. Atuo como principal desenvolvedor. Abaixo, uma decisão que tomamos em equipe e da qual participei do começo ao fim, porque ela resume como eu trabalho.
              - list [ref=f9e114]:
                - listitem [ref=f9e115]:
                  - strong [ref=f9e116]: O problema.
                  - text: O CRM era usado todo dia, mas boa parte das funções existia no papel e não na prática, porque a fundação não sustentava o que o produto pedia. Vivia fora da plataforma que a empresa já abria todo dia, e a base acumulada estava suja. Reescrever com o sistema no ar é mais delicado que partir do zero.
                - listitem [ref=f9e117]:
                  - strong [ref=f9e118]: A decisão.
                  - text: Decidimos reconstruir do zero como serviço dedicado dentro do ecossistema, em vez de remendar por partes. Mesmo banco da plataforma, schema separado, e autorização delegada ao serviço que já existia em vez de duplicar regra de acesso.
                - listitem [ref=f9e119]:
                  - strong [ref=f9e120]: O que custou.
                  - text: "Reescrever e migrar em paralelo, um serviço a mais para operar, e um contrato de API que precisou ser refeito: a primeira versão ainda carregava o formato do sistema antigo. Metade do trabalho foi o ETL, porque a base herdada estava suja e entrar com dado velho num modelo limpo é repetir o problema com outra roupa."
                - listitem [ref=f9e121]:
                  - strong [ref=f9e122]: Como fechamos a fronteira de dados.
                  - text: Entrada validada e normalizada antes de qualquer regra rodar, e saída declarada por schema em 46 endpoints, com 42 campos explicitamente fora da serialização. Coluna nova no banco não aparece sozinha na resposta, e há quatro suítes de teste só para isso.
              - generic [ref=f9e123]:
                - generic [ref=f9e124]: Resultado
                - paragraph [ref=f9e125]:
                  - text: "As funções que existiam só no papel passaram a ser usadas de fato, agora dentro da plataforma que a empresa já abre todo dia. O serviço mantém cadência própria:"
                  - strong [ref=f9e126]: 58 deploys em dois meses e meio
                  - text: . O time ficou visivelmente mais ativo, deixou de ser usuário passivo e virou proponente de melhoria.
              - paragraph [ref=f9e127]: React · TypeScript · FastAPI · NestJS · PostgreSQL · Azure
            - generic [ref=f9e128]: Privado
